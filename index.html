<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tipsy Ticket</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23fffdf7'/%3E%3Cpath d='M22 14h20l-3 17a10 10 0 0 1-14 0L22 14Z' fill='none' stroke='%23202020' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M32 34v12M24 50h16' fill='none' stroke='%23202020' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M25 23h14' stroke='%239b3d32' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f7f5ef;
      --paper: #fffdf7;
      --ink: #202020;
      --muted: #74706a;
      --line: rgba(32, 32, 32, .16);
      --line-strong: rgba(32, 32, 32, .32);
      --accent: #9b3d32;
      --accent-soft: #f2e3dc;
      --shadow: 0 18px 42px rgba(47, 38, 26, .12);
      font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      color: var(--ink);
      background:
        linear-gradient(rgba(58, 49, 38, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(58, 49, 38, .035) 1px, transparent 1px),
        var(--bg);
      background-size: 22px 22px;
    }

    body {
      min-height: 100dvh;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      color: inherit;
      cursor: pointer;
    }

    .app {
      width: min(100%, 1040px);
      margin: 0 auto;
      padding: 18px clamp(12px, 4vw, 30px) 30px;
      display: grid;
      grid-template-columns: minmax(0, 420px) minmax(0, 1fr);
      gap: clamp(14px, 3vw, 26px);
      align-items: start;
    }

    .mast {
      grid-column: 1 / -1;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      padding: 8px 2px 2px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 7vw, 54px);
      line-height: .95;
      letter-spacing: 0;
      font-weight: 800;
    }

    .date-line {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .stat {
      min-width: 82px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      background: rgba(255, 253, 247, .72);
      text-align: right;
    }

    .stat b {
      display: block;
      font-size: 18px;
      line-height: 1;
    }

    .stat span {
      color: var(--muted);
      font-size: 11px;
    }

    .receipt {
      position: relative;
      background: var(--paper);
      box-shadow: var(--shadow);
      border: 1px solid rgba(32, 32, 32, .08);
    }

    .receipt::before,
    .receipt::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 10px;
      background:
        linear-gradient(135deg, var(--bg) 7px, transparent 0) 0 0 / 14px 10px repeat-x,
        linear-gradient(225deg, var(--bg) 7px, transparent 0) 7px 0 / 14px 10px repeat-x;
      pointer-events: none;
    }

    .receipt::before {
      top: -1px;
    }

    .receipt::after {
      bottom: -1px;
      transform: rotate(180deg);
    }

    .form-receipt {
      position: sticky;
      top: 14px;
    }

    .receipt-inner {
      padding: 26px 18px 24px;
    }

    .ticket-title {
      margin: 0;
      padding-bottom: 14px;
      border-bottom: 1px dashed var(--line-strong);
      text-align: center;
      font-size: 18px;
      letter-spacing: 0;
    }

    .ticket-title small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
    }

    form {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 11px;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 0;
      background: #fffefa;
      color: var(--ink);
      padding: 9px 10px;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    textarea {
      min-height: 68px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--ink);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .chip {
      min-height: 32px;
      padding: 0 10px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
    }

    .chip.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .save {
      min-height: 44px;
      margin-top: 4px;
      background: var(--ink);
      color: var(--paper);
      font-weight: 700;
    }

    .secondary-row {
      display: flex;
      gap: 8px;
      justify-content: space-between;
      border-top: 1px dashed var(--line-strong);
      padding-top: 12px;
      margin-top: 2px;
    }

    .edit-status {
      display: none;
      margin: 4px 0 0;
      padding: 8px 0 0;
      border-top: 1px dashed var(--line-strong);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .edit-status.active {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .plain-button {
      min-height: 34px;
      padding: 0 8px;
      background: transparent;
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .tool-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 0 0 14px;
    }

    .tool-button {
      min-height: 36px;
      padding: 0 11px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
    }

    .file-input {
      position: absolute;
      inline-size: 1px;
      block-size: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .chart-receipt {
      margin-bottom: 16px;
    }

    .chart {
      display: grid;
      gap: 10px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed var(--line-strong);
    }

    .bar-row {
      display: grid;
      grid-template-columns: 58px 1fr 44px;
      gap: 8px;
      align-items: center;
      font-size: 12px;
    }

    .bar-label,
    .bar-count {
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bar-count {
      text-align: right;
    }

    .bar-track {
      height: 10px;
      border: 1px solid var(--line);
      background: #fffefa;
    }

    .bar-fill {
      height: 100%;
      width: var(--bar-width);
      background: var(--accent);
    }

    .chart-empty {
      min-height: 92px;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 12px;
      border: 1px dashed var(--line);
    }

    .chart-note {
      margin: 4px 0 0;
      padding-top: 10px;
      border-top: 1px dashed var(--line-strong);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .list-wrap {
      min-width: 0;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      padding: 0 2px 10px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 14px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 18px;
    }

    .section-head span {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .records {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .record {
      min-width: 0;
    }

    .record .receipt-inner {
      padding: 22px 14px 20px;
    }

    .record-top {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px dashed var(--line-strong);
    }

    .record-name {
      min-width: 0;
      font-size: 16px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .record-brand {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      overflow-wrap: anywhere;
    }

    .record-abv {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      padding: 5px 6px;
      font-size: 12px;
    }

    .lines {
      display: grid;
      gap: 7px;
      padding: 12px 0;
      border-bottom: 1px dashed var(--line-strong);
      font-size: 12px;
    }

    .line {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: end;
      min-width: 0;
    }

    .line::before {
      content: "";
      grid-column: 2;
      border-bottom: 1px dotted var(--line-strong);
      transform: translateY(-4px);
    }

    .line span:first-child {
      grid-column: 1;
      color: var(--muted);
    }

    .line span:last-child {
      grid-column: 3;
      min-width: 0;
      max-width: 145px;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .note {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .record-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 11px;
      color: var(--muted);
      font-size: 11px;
    }

    .delete {
      background: transparent;
      color: var(--muted);
      padding: 4px 0;
    }

    .edit {
      background: transparent;
      color: var(--muted);
      padding: 4px 0;
    }

    .action-pair {
      display: inline-flex;
      gap: 10px;
      align-items: center;
      flex: 0 0 auto;
    }

    .empty {
      grid-column: 1 / -1;
      min-height: 220px;
      display: grid;
      place-items: center;
      border: 1px dashed var(--line-strong);
      background: rgba(255, 253, 247, .54);
      color: var(--muted);
      text-align: center;
      padding: 24px;
      font-size: 13px;
    }

    @media (max-width: 820px) {
      .app {
        grid-template-columns: 1fr;
      }

      .form-receipt {
        position: static;
      }
    }

    @media (max-width: 560px) {
      .app {
        padding-inline: 12px;
      }

      .mast {
        align-items: stretch;
        flex-direction: column;
      }

      .stats {
        justify-content: stretch;
      }

      .stat {
        flex: 1;
        text-align: left;
      }

      .records {
        grid-template-columns: 1fr;
      }

      .grid-2 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="mast">
      <div>
        <h1>Tipsy Ticket</h1>
        <p class="date-line" id="todayLine">TODAY</p>
      </div>
      <div class="stats" aria-label="记录统计">
        <div class="stat">
          <b id="totalCount">0</b>
          <span>RECORDS</span>
        </div>
        <div class="stat">
          <b id="monthCount">0</b>
          <span>THIS MONTH</span>
        </div>
      </div>
    </header>

    <section class="receipt form-receipt" aria-label="新增喝酒记录">
      <div class="receipt-inner">
        <h2 class="ticket-title">NEW DRINK</h2>
        <form id="drinkForm">
          <label>
            日期时间
            <input id="time" name="time" type="datetime-local" required>
          </label>

          <div class="grid-2">
            <label>
              酒类
              <select id="type" name="type" required>
                <option>啤酒</option>
                <option>葡萄酒</option>
                <option>威士忌</option>
                <option>白酒</option>
                <option>鸡尾酒</option>
                <option>清酒</option>
                <option>其他</option>
              </select>
            </label>
            <label>
              度数 ABV
              <input id="abv" name="abv" type="number" min="0" max="99" step="0.1">
            </label>
          </div>

          <label>
            酒名
            <input id="name" name="name" type="text" required>
          </label>

          <div class="grid-2">
            <label>
              品牌
              <input id="brand" name="brand" type="text">
            </label>
            <label>
              产地
              <input id="origin" name="origin" type="text">
            </label>
          </div>

          <label>
            喝了多少
            <input id="amount" name="amount" type="text" required>
          </label>

          <label>
            感受
            <div class="chips" data-field="feeling">
              <button class="chip active" type="button" data-value="放松">放松</button>
              <button class="chip" type="button" data-value="开心">开心</button>
              <button class="chip" type="button" data-value="微醺">微醺</button>
              <button class="chip" type="button" data-value="喝多了">喝多了</button>
              <button class="chip" type="button" data-value="不舒服">不舒服</button>
            </div>
          </label>

          <label>
            场景
            <div class="chips" data-field="scene">
              <button class="chip active" type="button" data-value="家里">家里</button>
              <button class="chip" type="button" data-value="饭局">饭局</button>
              <button class="chip" type="button" data-value="酒吧">酒吧</button>
              <button class="chip" type="button" data-value="朋友聚会">朋友聚会</button>
              <button class="chip" type="button" data-value="独饮">独饮</button>
            </div>
          </label>

          <label>
            备注
            <textarea id="note" name="note"></textarea>
          </label>

          <button class="save" type="submit">SAVE RECEIPT</button>
          <div class="secondary-row">
            <button class="plain-button" type="reset">清空表单</button>
          </div>
          <div class="edit-status" id="editStatus">
            <span id="editText">EDITING</span>
            <button class="plain-button" type="button" id="cancelEdit">取消编辑</button>
          </div>
        </form>
      </div>
    </section>

    <section class="list-wrap" aria-label="历史记录">
      <div class="tool-row">
        <button class="tool-button" type="button" id="exportCsv">导出 Excel</button>
        <button class="tool-button" type="button" id="importCsv">导入 Excel</button>
        <input class="file-input" id="csvFile" type="file" accept=".csv,text/csv">
      </div>

      <section class="receipt chart-receipt" aria-label="统计图表">
        <div class="receipt-inner">
          <h2 class="ticket-title">STATS</h2>
          <div class="chart" id="typeChart"></div>
        </div>
      </section>

      <div class="section-head">
        <h2>历史小票</h2>
        <span id="latestText">NO RECEIPTS</span>
      </div>
      <div class="records" id="records"></div>
    </section>
  </main>

  <script>
    const storageKey = "drink-receipts-v1";
    const form = document.querySelector("#drinkForm");
    const recordsEl = document.querySelector("#records");
    const totalCountEl = document.querySelector("#totalCount");
    const monthCountEl = document.querySelector("#monthCount");
    const latestTextEl = document.querySelector("#latestText");
    const todayLineEl = document.querySelector("#todayLine");
    const typeChartEl = document.querySelector("#typeChart");
    const csvFileEl = document.querySelector("#csvFile");
    const saveButtonEl = document.querySelector(".save");
    const editStatusEl = document.querySelector("#editStatus");
    const editTextEl = document.querySelector("#editText");
    const cancelEditEl = document.querySelector("#cancelEdit");
    const state = {
      feeling: "放松",
      scene: "家里",
      records: [],
      editingId: null
    };

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function toLocalInputValue(date) {
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    function formatDate(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      return `${date.getFullYear()}.${pad(date.getMonth() + 1)}.${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    function escapeHTML(value) {
      return String(value || "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function getRecords() {
      try {
        return JSON.parse(localStorage.getItem(storageKey)) || [];
      } catch {
        return [];
      }
    }

    function saveRecords() {
      localStorage.setItem(storageKey, JSON.stringify(state.records));
    }

    function makeId() {
      return window.crypto && crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random());
    }

    function setActiveChip(group, value) {
      document.querySelectorAll(`.chips[data-field="${group}"] .chip`).forEach((chip) => {
        chip.classList.toggle("active", chip.dataset.value === value);
      });
    }

    function renderChart(records) {
      if (!records.length) {
        typeChartEl.innerHTML = `<div class="chart-empty">暂无统计</div>`;
        return;
      }

      const counts = records.reduce((acc, item) => {
        const key = item.type || "其他";
        acc[key] = (acc[key] || 0) + 1;
        return acc;
      }, {});
      const entries = Object.entries(counts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 7);
      const max = Math.max(...entries.map((entry) => entry[1]));

      typeChartEl.innerHTML = entries.map(([type, count]) => `
        <div class="bar-row">
          <span class="bar-label">${escapeHTML(type)}</span>
          <div class="bar-track" aria-hidden="true">
            <div class="bar-fill" style="--bar-width: ${(count / max) * 100}%"></div>
          </div>
          <span class="bar-count">${Math.round((count / records.length) * 100)}%</span>
        </div>
      `).join("") + `<p class="chart-note">按当前全部记录统计酒类占比，共 ${records.length} 条。</p>`;
    }

    function render() {
      const currentMonth = new Date().toISOString().slice(0, 7);
      const sorted = [...state.records].sort((a, b) => new Date(b.time) - new Date(a.time));
      const monthCount = sorted.filter((item) => String(item.time).slice(0, 7) === currentMonth).length;

      totalCountEl.textContent = sorted.length;
      monthCountEl.textContent = monthCount;
      latestTextEl.textContent = sorted.length ? `LAST / ${formatDate(sorted[0].time)}` : "NO RECEIPTS";
      renderChart(sorted);

      if (!sorted.length) {
        recordsEl.innerHTML = `<div class="empty">还没有记录。<br>第一张小票会出现在这里。</div>`;
        return;
      }

      recordsEl.innerHTML = sorted.map((item) => `
        <article class="receipt record">
          <div class="receipt-inner">
            <div class="record-top">
              <div>
                <div class="record-name">${escapeHTML(item.name)}</div>
                <div class="record-brand">${escapeHTML(item.brand || "未填品牌")}</div>
              </div>
              <div class="record-abv">${escapeHTML(item.abv ? `${item.abv}%` : "--")}</div>
            </div>
            <div class="lines">
              <div class="line"><span>酒类</span><span>${escapeHTML(item.type)}</span></div>
              <div class="line"><span>产地</span><span>${escapeHTML(item.origin || "未填")}</span></div>
              <div class="line"><span>数量</span><span>${escapeHTML(item.amount)}</span></div>
              <div class="line"><span>感受</span><span>${escapeHTML(item.feeling)}</span></div>
              <div class="line"><span>场景</span><span>${escapeHTML(item.scene)}</span></div>
            </div>
            ${item.note ? `<p class="note">${escapeHTML(item.note)}</p>` : ""}
            <div class="record-actions">
              <span>${formatDate(item.time)}</span>
              <span class="action-pair">
                <button class="edit" type="button" data-id="${item.id}">编辑</button>
                <button class="delete" type="button" data-id="${item.id}">删除</button>
              </span>
            </div>
          </div>
        </article>
      `).join("");
    }

    function resetFormTime() {
      form.time.value = toLocalInputValue(new Date());
    }

    function clearEditMode() {
      state.editingId = null;
      saveButtonEl.textContent = "SAVE RECEIPT";
      editStatusEl.classList.remove("active");
      editTextEl.textContent = "EDITING";
    }

    function resetFormState(resetFields = true) {
      if (resetFields) form.reset();
      state.feeling = "放松";
      state.scene = "家里";
      setActiveChip("feeling", state.feeling);
      setActiveChip("scene", state.scene);
      resetFormTime();
      clearEditMode();
    }

    function startEdit(id) {
      const item = state.records.find((record) => record.id === id);
      if (!item) return;
      state.editingId = id;
      form.time.value = item.time || toLocalInputValue(new Date());
      form.type.value = item.type || "其他";
      form.abv.value = item.abv || "";
      form.name.value = item.name || "";
      form.brand.value = item.brand || "";
      form.origin.value = item.origin || "";
      form.amount.value = item.amount || "";
      form.note.value = item.note || "";
      state.feeling = item.feeling || "放松";
      state.scene = item.scene || "家里";
      setActiveChip("feeling", state.feeling);
      setActiveChip("scene", state.scene);
      saveButtonEl.textContent = "UPDATE RECEIPT";
      editTextEl.textContent = `正在编辑：${item.name || "未命名"}`;
      editStatusEl.classList.add("active");
      form.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    document.querySelectorAll(".chips").forEach((group) => {
      group.addEventListener("click", (event) => {
        const chip = event.target.closest(".chip");
        if (!chip) return;
        const field = group.dataset.field;
        state[field] = chip.dataset.value;
        setActiveChip(field, state[field]);
      });
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const data = new FormData(form);
      const record = {
        id: state.editingId || makeId(),
        time: data.get("time"),
        type: data.get("type"),
        abv: data.get("abv"),
        name: data.get("name").trim(),
        brand: data.get("brand").trim(),
        origin: data.get("origin").trim(),
        amount: data.get("amount").trim(),
        note: data.get("note").trim(),
        feeling: state.feeling,
        scene: state.scene
      };

      if (state.editingId) {
        state.records = state.records.map((item) => item.id === state.editingId ? record : item);
      } else {
        state.records.push(record);
      }

      saveRecords();
      resetFormState();
      render();
    });

    form.addEventListener("reset", () => {
      window.setTimeout(() => resetFormState(false));
    });

    cancelEditEl.addEventListener("click", resetFormState);

    recordsEl.addEventListener("click", (event) => {
      const editButton = event.target.closest(".edit");
      const deleteButton = event.target.closest(".delete");

      if (editButton) {
        startEdit(editButton.dataset.id);
        return;
      }

      if (deleteButton) {
        if (state.editingId === deleteButton.dataset.id) resetFormState();
        state.records = state.records.filter((item) => item.id !== deleteButton.dataset.id);
        saveRecords();
        render();
      }
    });

    function csvEscape(value) {
      return `"${String(value || "").replace(/"/g, '""')}"`;
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let quoted = false;

      for (let index = 0; index < text.length; index += 1) {
        const char = text[index];
        const next = text[index + 1];

        if (char === '"' && quoted && next === '"') {
          cell += '"';
          index += 1;
        } else if (char === '"') {
          quoted = !quoted;
        } else if (char === "," && !quoted) {
          row.push(cell);
          cell = "";
        } else if ((char === "\n" || char === "\r") && !quoted) {
          if (char === "\r" && next === "\n") index += 1;
          row.push(cell);
          if (row.some((value) => value.trim())) rows.push(row);
          row = [];
          cell = "";
        } else {
          cell += char;
        }
      }

      row.push(cell);
      if (row.some((value) => value.trim())) rows.push(row);
      return rows;
    }

    document.querySelector("#exportCsv").addEventListener("click", () => {
      const headers = ["日期时间", "酒类", "酒名", "品牌", "产地", "度数", "喝了多少", "感受", "场景", "备注"];
      const rows = state.records
        .sort((a, b) => new Date(a.time) - new Date(b.time))
        .map((item) => [
          item.time,
          item.type,
          item.name,
          item.brand,
          item.origin,
          item.abv,
          item.amount,
          item.feeling,
          item.scene,
          item.note
        ]);
      const csv = [headers, ...rows].map((row) => row.map(csvEscape).join(",")).join("\n");
      const blob = new Blob([`\ufeff${csv}`], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `drink-receipts-${new Date().toISOString().slice(0, 10)}.csv`;
      link.click();
      URL.revokeObjectURL(url);
    });

    document.querySelector("#importCsv").addEventListener("click", () => {
      csvFileEl.click();
    });

    csvFileEl.addEventListener("change", async () => {
      const file = csvFileEl.files[0];
      if (!file) return;
      const rows = parseCsv(await file.text());
      const [, ...items] = rows;
      const imported = items.map((row) => ({
        id: makeId(),
        time: row[0] || toLocalInputValue(new Date()),
        type: row[1] || "其他",
        name: row[2] || "未命名",
        brand: row[3] || "",
        origin: row[4] || "",
        abv: row[5] || "",
        amount: row[6] || "",
        feeling: row[7] || "放松",
        scene: row[8] || "家里",
        note: row[9] || ""
      })).filter((item) => item.name || item.amount);

      state.records = [...state.records, ...imported];
      saveRecords();
      render();
      csvFileEl.value = "";
    });

    todayLineEl.textContent = `TODAY / ${formatDate(new Date())}`;
    state.records = getRecords();
    resetFormTime();
    render();
  </script>
</body>
</html>
